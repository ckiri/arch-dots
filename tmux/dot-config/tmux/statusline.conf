set -g mode-style "fg=black,bg=grey"

set -g message-style "fg=brightwhite,bg=black,fill=black"
set -g message-command-style "fg=brightwhite,bg=black,fill=black"

set -g prompt-cursor-color "brightwhite"

set -g pane-border-style "fg=white"
set -g pane-active-border-style "fg=#4c7899"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=black,bg=white"

set -g status-bg "white"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "[#S] "
set -g status-right ""

setw -g window-status-activity-style "underscore,fg=black,bg=white"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=black,bg=white"
setw -g window-status-current-style "NONE,fg=black,bg=white"
setw -g window-status-format '#I:#W-'
setw -g window-status-current-format '#I:#W*'
